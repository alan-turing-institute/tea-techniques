name: MCP Server Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'mcp-server/**'
      - '.github/workflows/mcp-server-tests.yml'

jobs:
  test:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: mcp-server/pnpm-lock.yaml

      # The tests never run the embedding model, so the packages' install scripts are not needed.
      - name: Install dependencies
        run: pnpm --dir mcp-server install --frozen-lockfile --ignore-scripts

      - name: Type check
        run: pnpm --dir mcp-server type-check

      # The tests of public/data/ld/embeddings.json skip here, where the file does not
      # exist. The Build job in ci-cd.yml makes the file and runs them.
      - name: Run tests
        run: pnpm --dir mcp-server test
