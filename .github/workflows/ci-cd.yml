name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter and format check
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Validate data
        run: pnpm validate
        continue-on-error: false

      - name: Test scripts
        run: pnpm test:scripts

  build:
    name: Build
    needs: quality-gates
    runs-on: ubuntu-latest
    # A hung step holds the pages concurrency group that deployments share.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@a3252b78c470c02df07e9d59298aecedc3ccdd6d # v3.0.0
        with:
          version: 10

      # mcp-server needs Node 22, which the site build also runs on.
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            mcp-server/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The stdio MCP server fetches public/data/ld/embeddings.json from the site. This job
      # makes it from the graph it publishes; git does not hold it. The generate step needs
      # the optional ONNX packages, which a plain install includes. Their install scripts
      # only fetch GPU files that the CPU model never loads.
      - name: Install mcp-server dependencies
        run: pnpm --dir mcp-server install --frozen-lockfile --ignore-scripts

      - name: Read the MiniLM revision
        id: minilm
        working-directory: mcp-server
        run: |
          revision=$(pnpm exec tsx -e "import { IN_PROCESS_MODEL } from './src/embedding/specs.ts'; console.log(IN_PROCESS_MODEL.revision)")
          if [[ ! "$revision" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Unexpected MiniLM revision: $revision" >&2
            exit 1
          fi
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Cache the MiniLM model
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mcp-server/.cache/huggingface
          key: minilm-${{ steps.minilm.outputs.revision }}

      # The site build regenerates graph.jsonld from techniques.json. Doing it here first
      # makes the vectors from the graph that is published.
      - name: Generate the graph
        run: pnpm generate-data

      # A failure here fails the job, so the site is not published without the file.
      - name: Generate the MiniLM vectors
        working-directory: mcp-server
        run: |
          pnpm generate-embeddings --model=minilm --data-dir=../public/data \
            --data-commit="$GITHUB_SHA" \
            --output=../public/data/ld/embeddings.json

      - name: Build project
        run: NODE_ENV=production pnpm build
        env:
          NODE_ENV: production

      # Compares the file with the graph the site build wrote. A mismatch fails the job
      # before the artifact is uploaded.
      - name: Check the MiniLM vectors
        run: pnpm --dir mcp-server exec vitest run tests/vectors-files.test.ts
        env:
          TEA_REQUIRE_PUBLISHED_VECTORS: '1'

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
