services:
  mcp:
    image: tea-techniques-mcp:local
    build:
      context: .
      args:
        DATA_REF: ${DATA_REF:-777cf5e752775b20537e1a499c3998eadc2bc184}
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      RANKING_CANDIDATES: ${RANKING_CANDIDATES:-8}
      RANKING_DEADLINE_MS: ${RANKING_DEADLINE_MS:-30000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - inference
  # Optional: Ollama inside the stack. Start with
  #   OLLAMA_URL=http://ollama:11434 docker compose --profile bundled-ollama up
  ollama:
    profiles: ["bundled-ollama"]
    image: ollama/ollama:0.40.1
    volumes:
      - models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
    networks:
      - inference
volumes:
  models:
    name: tea-techniques-mcp-models
networks:
  inference:
    internal: true
