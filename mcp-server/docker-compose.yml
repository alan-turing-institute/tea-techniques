services:
  mcp:
    image: tea-techniques-mcp:local
    build:
      context: .
      args:
        DATA_REF: ${DATA_REF:-777cf5e752775b20537e1a499c3998eadc2bc184}
    ports:
      - "127.0.0.1:3100:3100"
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
    networks:
      - inference
  ollama:
    image: ollama/ollama:0.40.1
    volumes:
      - models:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NO_CLOUD: "1"
    networks:
      - inference
volumes:
  models:
    name: tea-techniques-mcp-models
networks:
  inference:
    internal: true
